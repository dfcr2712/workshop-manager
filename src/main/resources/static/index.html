<!DOCTYPE html>
<html lang="en">
<head>
    <title>Workshop Manager</title>
</head>

<body>

<header>
    <h1>Workshop Manager</h1>
    <nav>

        <ul>
            <li>
                <a href="#customers">Customers</a>
            </li>
            <li>
                <a href="#vehicles">Vehicles</a>
            </li>
            <li>
                <a href="#service-orders">Service Orders</a>
            </li>
        </ul>

    </nav>
</header>

<main>
    <section id="customers">
        <h2>Customers</h2>
        <p>Manage workshop customers here.</p>

        <form>
            <fieldset>

                <legend>Customer Information</legend>
                <label for="name">Name</label>
                <input
                        id="name"
                        placeholder="John Smith"
                        name="name"
                        type="text"
                        autocomplete="name"
                        required>

                <label for="email">Email</label>
                <input
                        id="email"
                        placeholder="johnsmith@email.com"
                        name="email"
                        type="email"
                        autocomplete="email"
                        required>

                <label for="phone">Phone</label>
                <input
                        id="phone"
                        placeholder="+351 917642567"
                        name="phone"
                        type="tel"
                        autocomplete="tel"
                        required>

            </fieldset>

            <button type="submit">Create Customer</button>
        </form>

    </section>

    <section id="vehicles">
        <h2>Vehicles</h2>
        <p>Manage workshop vehicles here.</p>
    </section>

    <section id="service-orders">
        <h2>Service Orders</h2>
        <p>Manage workshop service orders here.</p>

        <form>
            <label for="priority">Priority</label>
            <select id="priority" name="priority" required>
                <option value="" selected disabled>Select priority</option>
                <option value="LOW">Low</option>
                <option value="NORMAL">Normal</option>
                <option value="HIGH">High</option>
            </select>

            <label for="customer-notes">Customer Notes</label>
            <textarea id="customer-notes"
                      name="customerNotes"
                      placeholder="Customer requires to check brake sound."
                      rows="4"
                      cols="40"></textarea>

            <fieldset>
                <legend>Estimate Decision</legend>
                <input type="radio" name="estimate-status" id="approved" value="APPROVED">
                <label for="approved">Approved</label>

                <input type="radio" name="estimate-status" id="rejected" value="REJECTED">
                <label for="rejected">Rejected</label>
            </fieldset>

            <button type="submit">Create Service Order</button>

        </form>
    </section>
</main>

</body>
</html>
