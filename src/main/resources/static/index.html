<!DOCTYPE html>
<html lang="en">
<head>
    <title>Workshop Manager</title>
</head>

<body>

<header>
    <h1>Workshop Manager</h1>
    <nav>

        <ul>
            <li>
                <a href="#customers">Customers</a>
            </li>
            <li>
                <a href="#vehicles">Vehicles</a>
            </li>
            <li>
                <a href="#service-orders">Service Orders</a>
            </li>
        </ul>

    </nav>
</header>

<main>
    <section id="customers">
        <h2>Customers</h2>
        <p>Manage workshop customers here.</p>
        <form>

            <label for="name">Name</label>
            <input id="name" name="name" type="text" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" required>

            <label for="phone">Phone</label>
            <input id="phone" name="phone" type="tel" required>

            <button type="submit">Create Customer</button>

        </form>
    </section>

    <section id="vehicles">
        <h2>Vehicles</h2>
        <p>Manage workshop vehicles here.</p>
    </section>

    <section id="service-orders">
        <h2>Service Orders</h2>
        <p>Manage workshop service orders here.</p>
    </section>
</main>

</body>
</html>
